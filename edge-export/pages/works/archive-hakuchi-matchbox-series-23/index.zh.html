"$\",\"main\",null,{\"className\":\"detail-shell\",\"children\":[[\"$\",\"div\",null,{\"className\":\"detail-topline\",\"children\":[[\"$\",\"a\",null,{\"className\":\"back-link\",\"href\":\"/?lang=zh\",\"children\":[\"← \",\"全部作品\"]}],[\"$\",\"span\",null,{\"children\":[\"37\",\" / \",\"47\",\" \",\"件作品\"]}]]}],[\"$\",\"$L8\",null,{\"work\":{\"id\":\"65833f7d-713a-4756-bc2d-91c67d568da3\",\"slug\":\"archive-hakuchi-matchbox-series-23\",\"title\":\"HAKUCHI Matchbox Series\",\"year\":\"Archive\",\"date\":\"\",\"category\":\"publications\",\"medium\":\"\",\"description\":\"（My work is the first matchbox from the left: The Illusion Maker ） HAKUCHI Matchbox Series (售罄 Sold out ) 2021.5 介紹 Matchbox——即「火柴盒」的概念在HAKUCHI的前作『幻人』中誕生。彼時我們以童話『賣火柴的小女孩』中火柴與幻覺的聯繫為靈感設計了作為別冊的火柴盒式袖珍攝影集『THE NOCTURNAL』。 『HAKUCHI Matchbox Series』針對讀圖做了兩方面嘗試:  首先，本系列以「掌上畫廊」的形式消解了閱讀順序的限制。它延續了HAKUCHI對於圖片編輯的關注，這一回我們將編輯的權力交到了讀者手中——你可以在桌面將卡片任意排列，甚至在牆面粘貼它們。我們稱其為「掌上畫廊」而非「掌上畫冊」，正是因為這種不受畫冊尺寸框定甚至突破平面限制的特性。由此本系列取消了傳統畫冊編輯中的線性約束，使「發散」得以在物理層面實現。作者/編輯與讀者之間的、頗具權力關係的訴說—傾聽式的交流方式也會被打破，讀圖將成為一次真正的再創作。 其次，基於HAKUCHI自詡的提倡視野共享的「視覺中樞」功能，『HAKUCHI Matchbox Series』沒有對作品進行過多的闡釋。讀者可以將自己的情緒自由代入圖像中，獲得新的觀看經驗。這個思路也體現在沒有鮮明屬性的系列名稱『HAKUCHI Matchbox Series』和克制的設計風格上。 或許是藉助『幻覺製造機』中穿過顯微鏡的深入內在的窺探視線，或是盛放在『Visceral』之中的內臟般溫柔的隱密感，或是『淥水』以繪畫語言對照片進行描摹而透露出的曖昧悸動，或是『Icaros』所再現的南美土著進行植物儀式時誦唱的療癒歌曲那修復靈魂的頻率——火柴盒們將在你每次讀圖時點燃，在你眼前展現切膚幻覺——這是我們希望這份禮物能夠帶給你的。 藝術家 舒慾（My artist name）、徐逸凡、阮小又、莫茹杰、尹子、柳川隸、杭笙 製作    李俊明 編輯 \u0026 裝幀設計    林伯山 產品拍攝    李俊明 Detail show\",\"images\":[\"/media/archive/24154073b12199c3.png\",\"/media/archive/66a94de5c751d522.png\",\"/media/archive/c8e3389e8818430a.png\",\"/media/archive/92108192852d27ca.png\",\"/media/archive/5b1fb173418af21f.png\",\"/media/archive/c596710fb8563078.png\",\"/media/archive/7230510cf88ead67.png\",\"/media/archive/f829282039c90adf.png\",\"/media/archive/8cac6e2e5516b7b6.png\"],\"sourceUrl\":\"\",\"sortOrder\":123,\"status\":\"published\",\"createdAt\":\"2026-10-02T14:34:19.921Z\",\"updatedAt\":\"2026-10-02T14:34:19.92
