<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>温舒喻 · WEN SHUYU 作品网站</title>
<meta name="description" content="温舒喻 Wen Shuyu 作品网站。">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#e7e5e5;color:#263442;font-family:Arial,"Helvetica Neue","PingFang SC",sans-serif}.desktop{display:grid;place-items:center;width:100vw;min-height:100svh}.stage{position:relative;width:min(100vw,160svh);height:min(100svh,62.5vw);aspect-ratio:8/5}.stage img{display:block;width:100%;height:100%;object-fit:contain}.portal-link{position:absolute;display:block;border-radius:4px}.shuyu{left:49.2%;top:38.1%;width:10.4%;height:18.5%}.progress{left:12.2%;top:33.2%;width:13.3%;height:29.5%}.portal-link:focus-visible,.mobile-folder:focus-visible,.flashlight:focus-visible{outline:3px solid #fff;outline-offset:4px}.mobile{display:none}
@media(max-width:620px){body{background:#21170f}.desktop{display:none}.mobile{position:relative;display:block;width:100%;height:100svh;overflow:hidden;isolation:isolate;color:#fff;background:#5b351e}.mobile-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-3;filter:brightness(.46) saturate(.72);transition:filter .75s ease}.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(12,7,3,.26),rgba(10,6,3,.07) 45%,rgba(7,4,2,.38));transition:opacity .75s ease}.mobile:after{content:"";position:absolute;left:-18vw;bottom:-12vw;width:115vw;height:115vw;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 82%,rgba(255,244,204,.88) 0,rgba(255,221,142,.46) 16%,rgba(255,196,102,.16) 36%,transparent 64%);opacity:0;transform:scale(.62);transform-origin:18% 82%;transition:opacity .65s ease,transform .8s cubic-bezier(.2,.75,.2,1)}.mobile.is-lit .mobile-bg{filter:brightness(1.06) saturate(.9)}.mobile.is-lit .shade{opacity:.16}.mobile.is-lit:after{opacity:1;transform:scale(1)}.title{position:absolute;top:max(48px,7svh);left:0;width:100%;padding:0 24px;text-align:center;text-shadow:0 1px 9px rgba(0,0,0,.52)}.title span{display:block;font-size:clamp(18px,5.2vw,25px);font-weight:500;letter-spacing:.025em}.title strong{display:block;margin-top:5px;font-size:clamp(12px,3.4vw,15px);font-weight:400;letter-spacing:.28em;text-indent:.28em;opacity:.88}.folders{position:absolute;left:50%;top:49%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,10vw,52px);width:min(82vw,390px);transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .5s ease .24s,transform .65s ease .18s}.mobile.is-lit .folders{opacity:1;pointer-events:auto;transform:translate(-50%,-52%)}.mobile-folder{display:flex;min-width:0;flex-direction:column;align-items:center;text-align:center;color:#fff;text-decoration:none;text-shadow:0 1px 7px rgba(0,0,0,.75)}.folder-shape{position:relative;display:block;width:clamp(88px,29vw,126px);height:clamp(66px,21.5vw,94px);margin-bottom:13px;border:1px solid rgba(255,255,255,.4);border-radius:8px;background:linear-gradient(155deg,rgba(255,226,126,.96),rgba(205,143,55,.96));box-shadow:0 10px 25px rgba(23,10,2,.32),inset 0 1px rgba(255,255,255,.55)}.folder-shape:before{content:"";position:absolute;left:7px;top:-9px;width:44%;height:18px;border:1px solid rgba(255,255,255,.35);border-bottom:0;border-radius:7px 7px 0 0;background:#e7ad54}.mobile-folder strong{font-size:clamp(12px,3.5vw,15px);line-height:1.2}.mobile-folder small{margin-top:4px;font-size:10px;letter-spacing:.08em;opacity:.74}.flashlight{position:absolute;left:24px;bottom:max(35px,5svh);display:grid;place-items:center;width:64px;height:64px;padding:0;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(20,14,10,.46);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.16);backdrop-filter:blur(12px);cursor:pointer;transition:background .25s ease,transform .2s ease}.flashlight:active{transform:scale(.94)}.flashlight svg{width:30px;height:30px;fill:currentColor}.is-lit .flashlight{background:rgba(255,240,190,.82);color:#5a391e;box-shadow:0 0 32px rgba(255,221,136,.52)}.hint{position:absolute;left:100px;bottom:max(54px,calc(5svh + 19px));margin:0;color:rgba(255,255,255,.82);font-size:11px;letter-spacing:.08em;text-shadow:0 1px 5px #000}}
@media(prefers-reduced-motion:reduce){.mobile-bg,.shade,.mobile:after,.folders{transition:none!important}}
</style>
</head>
<body>
<main class="desktop"><div class="stage"><img src="site-home-desktop.webp" alt="Wen Shuyu project desktop" fetchpriority="high"><a class="portal-link shuyu" href="/portfolio" aria-label="Enter Shuyu Portfolio"></a><a class="portal-link progress" href="/works-in-progress" aria-label="Enter Works in Progress"></a></div></main>
<main class="mobile" id="mobileEntrance" aria-label="Wen Shuyu mobile entrance"><img class="mobile-bg" src="mobile-box-lockscreen.webp" alt="" fetchpriority="high"><div class="shade" aria-hidden="true"></div><header class="title"><span>温舒喻 · WEN SHUYU</span><strong>作品网站</strong></header><nav class="folders" aria-label="Website sections"><a class="mobile-folder" href="/portfolio"><span class="folder-shape" aria-hidden="true"></span><strong>Shuyu Portfolio</strong><small>作品档案</small></a><a class="mobile-folder" href="/works-in-progress"><span class="folder-shape" aria-hidden="true"></span><strong>Works in Progress</strong><small>概念与实验</small></a></nav><button class="flashlight" id="flashlight" type="button" aria-pressed="false" aria-label="打开手电筒"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 3h12l-1 6-2 3v15a3 3 0 0 1-6 0V12l-2-3-1-6Zm4 11v12a1 1 0 0 0 2 0V14h-2Zm-1-8 .25 2h5.5L19 6h-6Z"/></svg></button><p class="hint" id="hint">打开手电筒</p></main>
<script>const entrance=document.getElementById('mobileEntrance'),button=document.getElementById('flashlight'),hint=document.getElementById('hint');button.addEventListener('click',()=>{const lit=entrance.classList.toggle('is-lit');button.setAttribute('aria-pressed',String(lit));button.setAttribute('aria-label',lit?'关闭手电筒':'打开手电筒');hint.textContent=lit?'点击文件夹进入':'打开手电筒'})</script>
</body></html>
